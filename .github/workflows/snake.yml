name: Generate Snake Animation

on:
  # Run automatically every 24 hours
  schedule:
    - cron: "0 0 * * *"
  
  # Allows manual trigger at any time
  workflow_dispatch:
  
  # Run on push to main or master branch
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Generates snake game animation from contribution graph
      - name: generate github-contribution-grid-snake.svg
        uses: platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: generate contributions.json
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const query = `query($login: String!) {
              user(login: $login) {
                contributionsCollection {
                  contributionCalendar {
                    totalContributions
                    weeks {
                      contributionDays {
                        date
                        contributionCount
                        contributionLevel
                      }
                    }
                  }
                }
              }
            }`;
            const result = await github.graphql(query, { login: context.repo.owner });
            const calendar = result.user.contributionsCollection.contributionCalendar;
            const payload = {
              username: context.repo.owner,
              updatedAt: new Date().toISOString(),
              totalContributions: calendar.totalContributions,
              weeks: calendar.weeks
            };
            fs.mkdirSync('dist', { recursive: true });
            fs.writeFileSync('dist/contributions.json', JSON.stringify(payload, null, 2));

      # Push the SVG files to the 'output' branch
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

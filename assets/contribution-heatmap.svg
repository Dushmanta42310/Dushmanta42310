  <style>
    .mono { font-family: "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .panel { animation: fadeUp .9s ease both; }
    .fresh { animation: flash 2.2s ease-in-out infinite; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes flash { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="900" height="230" fill="#0d1117"/>
    <circle cx="70" cy="14" r="70" fill="#00ff66" opacity="0.035"/>
    <rect x="70" y="95" width="60" height="105" fill="url(#sweep)">
      <animate attributeName="x" from="70" to="850" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="8" y="8" width="884" height="214" rx="12" stroke="#30363d" fill="none"/>

  <circle cx="36" cy="38" r="4" fill="#00ff66">
    <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="50" y="42" class="mono" font-size="15" font-weight="700" fill="#00ff66">CONTRIBUTION ACTIVITY</text>
  <text x="50" y="60" class="mono" font-size="11" fill="#8b949e">52 weeks of commits · synced with GitHub</text>
  <text x="856" y="42" text-anchor="end" class="mono" font-size="12" fill="#38bdf8">69 CONTRIBUTIONS</text>
  <text x="856" y="60" text-anchor="end" class="mono" font-size="11" fill="#8b949e">last 12 months</text>

  <g class="mono" font-size="10" fill="#6e7681">
    <text x="70" y="86">Jan</text>
    <text x="133" y="86">Feb</text>
    <text x="196" y="86">Mar</text>
    <text x="259" y="86">Apr</text>
    <text x="322" y="86">May</text>
    <text x="385" y="86">Jun</text>
    <text x="448" y="86">Jul</text>
    <text x="511" y="86">Aug</text>
    <text x="574" y="86">Sep</text>
    <text x="637" y="86">Oct</text>
    <text x="700" y="86">Nov</text>
    <text x="763" y="86">Dec</text>
  </g>

  <g class="panel">
    <rect x="70" y="95" width="780" height="105" rx="3" fill="url(#heat)"/>
    <rect x="175" y="125" width="13" height="13" rx="2" fill="#00ff66" filter="url(#glow)" class="fresh"/>
    <rect x="355" y="155" width="13" height="13" rx="2" fill="#00ff66" filter="url(#glow)" class="fresh" style="animation-delay:.7s"/>
    <rect x="565" y="110" width="13" height="13" rx="2" fill="#00ff66" filter="url(#glow)" class="fresh" style="animation-delay:1.4s"/>
    <rect x="775" y="170" width="13" height="13" rx="2" fill="#00ff66" filter="url(#glow)" class="fresh" style="animation-delay:2.1s"/>
  </g>

  <g class="mono" font-size="10" fill="#6e7681">
    <text x="70" y="217">Less</text>
    <rect x="104" y="206" width="10" height="10" rx="2" fill="#161b22"/>
    <rect x="120" y="206" width="10" height="10" rx="2" fill="#0e4429"/>
    <rect x="136" y="206" width="10" height="10" rx="2" fill="#006d32"/>

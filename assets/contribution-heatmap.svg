<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" fill="none">
  <defs>
    <linearGradient id="sweep" x1="0" y1="0" x2="60" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00ff66" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00ff66" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#00ff66" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

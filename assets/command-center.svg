<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" fill="none">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="900" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111a24"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#00ff66" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#00ff66" stop-opacity="0.06"/>
      <stop offset="0.5" stop-color="#00ff66" stop-opacity="0.16"/>
      <stop offset="0.75" stop-color="#00ff66" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#00ff66" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#00ff66"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" stroke="#1f2a37" stroke-width="0.6" fill="none"/>
    </pattern>
    <clipPath id="frame">
      <rect x="8" y="8" width="884" height="284" rx="14"/>
    </clipPath>
    <clipPath id="lineA">
      <rect x="40" y="98" width="0" height="28">
        <animate attributeName="width" values="0;0;350;350;0" keyTimes="0;0.04;0.28;0.94;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="lineB">
      <rect x="40" y="152" width="0" height="28">
        <animate attributeName="width" values="0;0;460;460;0" keyTimes="0;0.30;0.54;0.94;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="lineC">
      <rect x="40" y="206" width="0" height="28">
        <animate attributeName="width" values="0;0;460;460;0" keyTimes="0;0.56;0.80;0.94;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>
  <style>
    .mono { font-family: "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .accent { fill: #00ff66; }
    .blue { fill: #38bdf8; }
    .muted { fill: #8b949e; }
    .pill { animation: breathe 2.6s ease-in-out infinite; }
    .dot { animation: blink 1.1s steps(1) infinite; }
    @keyframes breathe { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="900" height="300" fill="url(#panel)"/>
    <rect width="900" height="300" fill="url(#grid)" opacity="0.7"/>
    <rect x="-520" y="8" width="520" height="284" fill="url(#scan)">
      <animate attributeName="x" from="-520" to="900" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="-900" y="8" width="520" height="284" fill="url(#scan)" opacity="0.55">
      <animate attributeName="x" from="-900" to="900" dur="11s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="8" y="8" width="884" height="284" rx="14" stroke="#30363d" fill="none"/>

  <circle cx="40" cy="48" r="4" class="accent">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="54" y="52" class="mono muted" font-size="12" letter-spacing="1.6">COMMAND CENTER // DUSHMANTA.DEV</text>
  <text x="850" y="52" text-anchor="end" class="mono accent" font-size="12">v2.6.0</text>
  <text x="850" y="76" text-anchor="end" class="mono muted" font-size="10" letter-spacing="1">SOURCE: GITHUB API</text>

  <text x="40" y="94" class="mono blue" font-size="15">$ whoami</text>
  <g clip-path="url(#lineA)">
    <text x="40" y="116" class="mono" font-size="15" fill="#c9d1d9">Dusshmanta Dev  |  @Dushmanta42310</text>
  </g>
  <rect x="42" y="104" width="8" height="16" class="accent dot"/>

  <text x="40" y="148" class="mono blue" font-size="15">$ git profile --stats</text>
  <g clip-path="url(#lineB)">
    <text x="40" y="170" class="mono" font-size="14" fill="#c9d1d9">10 PUBLIC REPOS · 3 FOLLOWERS · 3 FOLLOWING · 1 STAR</text>
  </g>
  <rect x="42" y="158" width="8" height="16" class="accent dot"/>

  <text x="40" y="202" class="mono blue" font-size="15">$ git status --profile</text>
  <g clip-path="url(#lineC)">
    <text x="40" y="224" class="mono" font-size="14" fill="#c9d1d9">KHURDHA, ODISHA, INDIA · GITHUB SINCE 2024-10-29</text>
  </g>
  <rect x="42" y="212" width="8" height="16" class="accent dot"/>

  <g>
    <circle cx="730" cy="150" r="88" stroke="#21262d" stroke-width="1" fill="none"/>
    <circle cx="730" cy="150" r="62" stroke="#30363d" stroke-width="1" stroke-dasharray="4 6" fill="none"/>
    <circle cx="730" cy="150" r="38" stroke="#1f3b4d" stroke-width="1" fill="none"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 730 150" to="360 730 150" dur="16s" repeatCount="indefinite"/>
      <circle cx="730" cy="62" r="5" fill="#00ff66"/>
      <circle cx="818" cy="150" r="4" fill="#38bdf8"/>
      <circle cx="730" cy="238" r="3" fill="#00ff66" opacity="0.6"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360 730 150" to="0 730 150" dur="11s" repeatCount="indefinite"/>
      <circle cx="668" cy="150" r="4" fill="#38bdf8" opacity="0.8"/>
      <circle cx="730" cy="88" r="3" fill="#00ff66"/>
    </g>
    <circle cx="730" cy="150" r="29" fill="#0b1220" stroke="url(#core)" stroke-width="2"/>
    <text x="730" y="158" text-anchor="middle" class="mono" font-size="22" font-weight="700" fill="#00ff66">DD</text>
  </g>

  <g class="pill">
    <rect x="40" y="250" width="158" height="28" rx="14" fill="#0b2618" stroke="#00ff66" stroke-opacity="0.45"/>
    <circle cx="58" cy="264" r="4" fill="#00ff66"/>
    <text x="70" y="268" class="mono" font-size="11" fill="#7ee2a8">SYSTEM ONLINE</text>
  </g>
  <g class="pill" style="animation-delay:.8s">
    <rect x="212" y="250" width="176" height="28" rx="14" fill="#0b1f2e" stroke="#38bdf8" stroke-opacity="0.45"/>
    <circle cx="230" cy="264" r="4" fill="#38bdf8"/>
    <text x="242" y="268" class="mono" font-size="11" fill="#7dd3fc">ALWAYS BUILDING</text>
  </g>
  <g class="pill" style="animation-delay:1.6s">
    <rect x="402" y="250" width="200" height="28" rx="14" fill="#161b22" stroke="#30363d"/>
    <circle cx="420" cy="264" r="4" fill="#00ff66"/>
    <text x="432" y="268" class="mono" font-size="11" fill="#8b949e">GITHUB API DATA</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="450" height="195" viewBox="0 0 450 195" fill="none">
  <style>
    .bg { fill: #0d1117; rx: 8px; stroke: #30363d; stroke-width: 1px; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 600; fill: #00ff66; }
    .stat-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #c9d1d9; font-weight: 400; }
    .stat-value { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #38bdf8; }
    .rank-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #8b949e; }
    .rank-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 28px; font-weight: 800; fill: #00ff66; }
    .icon { fill: #00ff66; }
  </style>

  <rect width="450" height="195" class="bg"/>

  <!-- Title -->
  <text x="25" y="35" class="title">Dushmanta's GitHub Stats</text>

  <!-- Stat 1: Total Stars -->
  <path d="M25 62 L27.5 68 L34 68.5 L29 73 L30.5 79 L25 75.5 L19.5 79 L21 73 L16 68.5 L22.5 68 Z" class="icon"/>
  <text x="42" y="73" class="stat-label">Total Stars Earned:</text>
  <text x="210" y="73" class="stat-value">5+</text>

  <!-- Stat 2: Total Commits -->
  <path d="M25 92 M21 97 A4 4 0 1 1 29 97 A4 4 0 1 1 21 97 M17 97 L21 97 M29 97 L33 97" stroke="#00ff66" stroke-width="2" fill="none"/>
  <text x="42" y="101" class="stat-label">Total Contributions:</text>
  <text x="210" y="101" class="stat-value">69 (Last Year)</text>

  <!-- Stat 3: Total PRs -->
  <path d="M22 120 L22 132 M22 124 L28 124 L28 132" stroke="#00ff66" stroke-width="2" fill="none"/>
  <circle cx="22" cy="120" r="2" class="icon"/>
  <circle cx="22" cy="132" r="2" class="icon"/>
  <circle cx="28" cy="132" r="2" class="icon"/>
  <text x="42" y="129" class="stat-label">Total Pull Requests:</text>
  <text x="210" y="129" class="stat-value">12+</text>

  <!-- Stat 4: Public Repos -->
  <path d="M20 148 H30 V160 H20 Z M23 145 H27 V148 H23 Z" stroke="#00ff66" stroke-width="1.5" fill="none"/>
  <text x="42" y="157" class="stat-label">Public Repositories:</text>
  <text x="210" y="157" class="stat-value">8+</text>

  <!-- Rank Ring -->
  <circle cx="360" cy="105" r="40" stroke="#30363d" stroke-width="6" fill="none"/>
  <circle cx="360" cy="105" r="40" stroke="#00ff66" stroke-width="6" stroke-dasharray="250" stroke-dashoffset="60" fill="none"/>
  <text x="360" y="114" text-anchor="middle" class="rank-badge">A+</text>
  <text x="360" y="160" text-anchor="middle" class="rank-title">GitHub Rank</text>
</svg>

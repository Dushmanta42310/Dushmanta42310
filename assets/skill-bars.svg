<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" fill="none">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#00ff66"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" stroke="#1b2531" stroke-width="0.5" fill="none"/>
    </pattern>
  </defs>
  <style>
    .mono { font-family: "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .card { fill: #111820; stroke: #30363d; stroke-width: 1; }
    .label { font-size: 11px; fill: #c9d1d9; }
    .value { font-size: 10px; fill: #00ff66; }
    .title { font-size: 13px; font-weight: 700; fill: #38bdf8; }
    .track { fill: #21262d; }
    .fill {
      fill: url(#bar);
      transform-box: fill-box;
      transform-origin: left center;
      animation: grow 1.5s cubic-bezier(.2,.8,.2,1) both;
    }
    .live { animation: pulse 2s ease-in-out infinite; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  </style>

  <rect width="900" height="460" fill="#0d1117"/>
  <rect width="900" height="460" fill="url(#grid)" opacity="0.6"/>
  <circle cx="36" cy="30" r="4" fill="#00ff66" class="live"/>
  <text x="50" y="34" class="mono" font-size="15" font-weight="700" fill="#00ff66">SKILL MATRIX // LIVE PROFICIENCY</text>
  <text x="870" y="34" text-anchor="end" class="mono" font-size="11" fill="#8b949e">16 CORE SKILLS · 4 DOMAINS</text>

